services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakery}
      POSTGRES_USER: ${POSTGRES_USER:-bakery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bakery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: postgres
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    volumes:
      - bakery_media:/app/media
      - bakery_private_media:/app/private_media
      - bakery_static:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-False}
    command: ["/bin/sh", "/etc/nginx/start-nginx.sh"]
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/http.conf:ro
      - ./nginx/https.conf:/etc/nginx/https.conf:ro
      - ./nginx/http-https.conf:/etc/nginx/http-https.conf:ro
      - ./nginx/start-nginx.sh:/etc/nginx/start-nginx.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - bakery_media:/media:ro
      - bakery_static:/static:ro
    depends_on:
      - web

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

volumes:
  bakery_postgres_data:
  bakery_media:
  bakery_private_media:
  bakery_static:
  letsencrypt:
  certbot_webroot:
