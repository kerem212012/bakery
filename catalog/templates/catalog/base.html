{% extends "core/base.html" %}

{% block title %}Каталог — Лукоморье{% endblock %}
{% block shell_class %} catalog-page{% endblock %}
{% block main_class %}catalog-main{% endblock %}

{% block content %}{% endblock %}

{% block scripts %}
    <script>
        const catalogGrid = document.querySelector(".catalog-grid");
        const catalogViewButtons = document.querySelectorAll("[data-catalog-view]");

        catalogViewButtons.forEach((button) => {
            button.addEventListener("click", () => {
                const isListView = button.dataset.catalogView === "list";
                catalogGrid.classList.toggle("is-list-view", isListView);
                catalogViewButtons.forEach((viewButton) => {
                    const isActive = viewButton === button;
                    viewButton.classList.toggle("is-active", isActive);
                    viewButton.setAttribute("aria-pressed", String(isActive));
                });
            });
        });

        const formatPrice = (amount) => new Intl.NumberFormat("ru-RU", {
            maximumFractionDigits: 0
        }).format(amount);

        const updateSizePrice = (control, sizeCm) => {
            const productCard = control.closest(".catalog-product-card, .favorite-card, .product-detail-panel");
            const price = productCard?.querySelector("[data-size-price]");
            const basePrice = Number(price?.dataset.basePrice);
            const size = Number(sizeCm);
            if (!price || !Number.isFinite(basePrice) || !Number.isFinite(size) || size <= 0) return;

            price.textContent = formatPrice(Math.round(basePrice * (size / 8) ** 2));
        };

        document.querySelectorAll("[data-size-price-control]").forEach((select) => {
            select.addEventListener("change", () => updateSizePrice(select, select.value));
        });

        document.querySelectorAll("[data-size-cm]").forEach((button) => {
            button.addEventListener("click", () => {
                const group = button.closest(".option-pills");
                group.querySelectorAll("[data-size-cm]").forEach((sizeButton) => {
                    const isSelected = sizeButton === button;
                    sizeButton.classList.toggle("is-selected", isSelected);
                    sizeButton.setAttribute("aria-pressed", String(isSelected));
                });
                updateSizePrice(button, button.dataset.sizeCm);
                const sizeInput = button.closest("form")?.querySelector('input[name="size"]');
                if (sizeInput) sizeInput.value = button.dataset.sizeCm;
            });
        });

        document.querySelectorAll("[data-option-choice]").forEach((button) => {
            button.addEventListener("click", () => {
                const group = button.closest("[role='group']");
                group.querySelectorAll("[data-option-choice]").forEach((choice) => {
                    const isSelected = choice === button;
                    choice.classList.toggle("is-selected", isSelected);
                    choice.setAttribute("aria-pressed", String(isSelected));
                });
                const fieldName = group.dataset.cartField;
                const fieldInput = fieldName && group.closest("form")?.querySelector(`input[name="${fieldName}"]`);
                if (fieldInput && button.dataset.cartValue) fieldInput.value = button.dataset.cartValue;
            });
        });

        document.querySelectorAll("[data-quantity-step]").forEach((button) => {
            button.addEventListener("click", () => {
                const input = button.closest(".quantity-picker").querySelector("input");
                const nextValue = Number(input.value) + Number(button.dataset.quantityStep);
                input.value = String(Math.min(Number(input.max), Math.max(Number(input.min), nextValue)));
            });
        });

        const deliverySelect = document.querySelector("[data-cart-delivery-select]");
        if (deliverySelect) {
            const updateCartTotal = () => {
                const subtotal = Number(document.querySelector("[data-cart-subtotal]")?.dataset.cartSubtotal || 0);
                const deliveryCost = Number(deliverySelect.selectedOptions[0]?.dataset.cost || 0);
                const deliveryElement = document.querySelector("[data-cart-delivery]");
                const totalElement = document.querySelector("[data-cart-total]");
                const priceFormat = new Intl.NumberFormat("ru-RU", { maximumFractionDigits: 0 });
                if (deliveryElement) deliveryElement.textContent = `${priceFormat.format(deliveryCost)} ₽`;
                if (totalElement) totalElement.textContent = `${priceFormat.format(subtotal + deliveryCost)} ₽`;
            };
            deliverySelect.addEventListener("change", updateCartTotal);
            updateCartTotal();
        }
    </script>
{% endblock %}
