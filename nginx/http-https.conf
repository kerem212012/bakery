server {
    listen 80;
    server_name vkusnodasladko.ru www.vkusnodasladko.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name 129.101.102.189;
    return 301 https://vkusnodasladko.ru$request_uri;
}
