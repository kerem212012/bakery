server {
    listen 443 ssl;
    http2 on;
    server_name vkusnodasladko.ru www.vkusnodasladko.ru;

    ssl_certificate /etc/letsencrypt/live/vkusnodasladko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vkusnodasladko.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web_upstream web:8000;
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
